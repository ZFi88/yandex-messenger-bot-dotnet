name: CI

on:
  push:
    branches:
      - develop
      - 'release/*'
      - master
      - 'bugfix/*'

permissions:
  id-token: write
  contents: read

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'NuGet login (OIDC -> temp API key)'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: 'Export NuGet API key'
        run: echo "NUGET_API_KEY=${{ steps.nuget-login.outputs.NUGET_API_KEY }}" >> "$GITHUB_ENV"
        shell: bash
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: Publish'
        run: dotnet fallout Publish
